server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes: anything that is not a real file is handed to
    # index.html so a reload on /teams/3 does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same origin as the app, which is what keeps CORS out of the picture.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A debate arrives as server-sent events. Left on, nginx would hold
        # every token until the response ended, and the canvas would sit still
        # for minutes and then fill in at once.
        proxy_buffering off;
        proxy_cache off;

        # A twenty-agent swarm on a local model runs well past any default.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
