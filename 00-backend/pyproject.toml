[project]
name = "hivemind-backend"
version = "0.1.0"
description = "Local multi-agent debate engine: LangGraph over Ollama and LM Studio, streamed to a canvas."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "sse-starlette>=3.4.8",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.uv]
package = false
